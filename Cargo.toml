[package]
name = "tai-time"
# When incrementing version and releasing to crates.io:
# - Update crate version in README.md
# - Update CHANGELOG.md
# - Update if necessary copyright notice in LICENSE-MIT
# - Create a "vX.Y.Z" git tag
version = "1.0.0"
authors = ["Asynchronics and the tai-time Contributors"]
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asynchronics/tai-time"
readme = "README.md"
description = """
Nanosecond-precision monotonic clock timestamps based on the TAI time standard.
"""
categories = ["date-and-time", "no-std", "science", "embedded"]
keywords = ["date", "time", "monotonic", "tai", "gps"]

[dependencies]
chrono = { version = "0.4.31", default-features = false, optional = true }
schemars = { version = "1.2", optional = true }
serde = { version = "1", default-features = false, features = [
    "derive",
], optional = true }
nix = { version = "0.31", default-features = false, features = [
    "time",
], optional = true }
defmt = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["std"]
std = []
chrono = ["dep:chrono"]
schemars = ["dep:schemars"]
serde = ["dep:serde"]
defmt = ["dep:defmt"]
tai_clock = ["dep:nix"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
